# Project-local MCP server. Codex loads this only for trusted checkouts.
[mcp_servers.code-review-graph]
command = ".code-review-graph/venv/bin/code-review-graph"
args = [
  "serve",
  "--tools",
  "build_or_update_graph_tool,get_minimal_context_tool,get_impact_radius_tool,get_review_context_tool,query_graph_tool,traverse_graph_tool,semantic_search_nodes_tool,list_graph_stats_tool,get_architecture_overview_tool,detect_changes_tool",
]
